[package]
name = "mini-ebpf"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
aya-ebpf = "0.2"
aya-ebpf-bindings = "0.2"
aya-ebpf-cty = "0.3"
mini-ebpf-common = { path = "../mini-ebpf-common" }

[profile.release]
opt-level = 2
debug = false
overflow-checks = false
lto = true
panic = "abort"
codegen-units = 1
