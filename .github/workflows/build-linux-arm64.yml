name: Build Linux arm64

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-aarch64:
    name: mini-proxy (linux/aarch64)
    runs-on: ubuntu-24.04-arm   # native arm64 runner – no cross needed
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        # Host is already aarch64-unknown-linux-gnu

      - name: Install nightly + rust-src (for eBPF)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          # Do NOT list bpfel-unknown-none here.
          # That target has no prebuilt rust-std on aarch64 host;
          # we use -Zbuild-std=core instead.

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            mini-ebpf
            mini-proxy

      # Ubuntu 24.04 has no unversioned libpolly-dev.
      # Install the common set; polly is optional for many bpf-linker builds.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm-dev
          # Best-effort versioned polly (ignore if missing)
          sudo apt-get install -y libpolly-19-dev || \
          sudo apt-get install -y libpolly-18-dev || \
          sudo apt-get install -y libpolly-17-dev || true
          echo "LLVM_CONFIG_PATH=$(which llvm-config || true)" >> $GITHUB_ENV
          llvm-config --version || true
          rustc +nightly -vV | grep -E 'llvm|host' || true

      - name: Install bpf-linker
        run: |
          # Prefer a version that can talk to current nightly LLVM.
          # If system LLVM is too old, bpf-linker may still build against
          # the one bundled with nightly via llvm-tools.
          cargo +nightly install bpf-linker --locked 2>/dev/null || \
          cargo +nightly install bpf-linker

      - name: Build eBPF object
        working-directory: mini-ebpf
        run: |
          cargo +nightly build --release \
            -Zbuild-std=core \
            --target bpfel-unknown-none

      - name: Build userspace (aarch64, with ebpf)
        run: |
          cargo +stable build --release --features ebpf

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mini-proxy-linux-aarch64
          path: target/release/mini-proxy
          if-no-files-found: error

      - name: Smoke test
        run: |
          file target/release/mini-proxy
          ./target/release/mini-proxy --help || true
